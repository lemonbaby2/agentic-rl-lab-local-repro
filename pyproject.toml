[project]
name = "agentic-rl-lab-local-repro"
version = "0.1.0"
description = "在单张消费级 GPU 上本地复现 datawhalechina/agentic-rl-lab 的 Agentic RL 算法，并配套知识点与 SOTA 梳理"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "torch>=2.6.0",
    "transformers>=4.56.0",
    "peft>=0.14.0",
    "accelerate>=1.0.0",
    "datasets>=3.0.0",
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "sympy>=1.12.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
